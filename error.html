<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>ZoNe 206 - Erreur</title>
    <link rel="stylesheet" href="css/style2.css">
</head>

<body class="login-page">

    <div class="background-overlay"></div>

    <div class="login-wrapper">
        <div class="login-card" style="max-width:500px;">

            <div class="login-logo">
                <div class="wifi-symbol" style="background:linear-gradient(135deg,#ff4444,#cc0000);">⚠️</div>
                <div class="zone-title">ZoNe <span>206</span></div>
                <div class="wifi-subtitle">Erreur de connexion</div>
            </div>

            <div class="error-message" style="font-size:14px;padding:16px;">
                ⚠️ $(error)
            </div>

            <p style="text-align:center;color:rgba(255,255,255,0.6);font-size:12px;margin:15px 0;">
                <a href="$(link-login)" style="color:#6be5ff;text-decoration:none;font-weight:700;">
                    ← Retour à la page de connexion
                </a>
            </p>

            <div class="copyright">© 2026 ZoNe 206 - Tous droits réservés</div>

        </div>
    </div>

</body>

</html>
