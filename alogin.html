<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="7; url=$(link-status)">
  <meta name="theme-color" content="#061536">
  <title>ZoNe 206 — Connexion réussie</title>

  <style>
    :root {
      --navy: #061536;
      --blue: #075cff;
      --cyan: #20e7ff;
      --green: #35f2a0;
      --white: #f5faff;
      --muted: #b7c9e8;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      color: var(--white);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      background:
        radial-gradient(ellipse at 8% 10%, rgba(0, 126, 255, .62), transparent 32%),
        radial-gradient(ellipse at 92% 82%, rgba(0, 238, 199, .25), transparent 30%),
        linear-gradient(135deg, #06102d 0%, #08245b 48%, #030d24 100%);
    }

    /* Rubans lumineux décoratifs */
    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 70vw;
      height: 70vw;
      max-width: 850px;
      max-height: 850px;
      border: 1px solid rgba(32, 231, 255, .18);
      border-radius: 42% 58% 60% 40%;
      pointer-events: none;
    }

    body::before {
      top: -48%;
      left: -22%;
      transform: rotate(24deg);
      box-shadow: 0 0 0 22px rgba(7, 92, 255, .045),
                  0 0 0 50px rgba(32, 231, 255, .035);
    }

    body::after {
      right: -25%;
      bottom: -52%;
      transform: rotate(-30deg);
      box-shadow: 0 0 0 24px rgba(32, 231, 255, .04),
                  0 0 0 55px rgba(7, 92, 255, .045);
    }

    .card {
      position: relative;
      width: min(100%, 410px);
      padding: 30px 25px 23px;
      overflow: hidden;
      border: 1px solid rgba(90, 207, 255, .75);
      border-radius: 28px;
      background: linear-gradient(155deg, #102f69 0%, #071b43 52%, #061633 100%);
      box-shadow: 0 25px 75px rgba(0, 0, 0, .48),
                  0 0 35px rgba(0, 125, 255, .18),
                  inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 250px;
      height: 180px;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(32, 231, 255, .25);
      filter: blur(42px);
      pointer-events: none;
    }

    .content { position: relative; }

    .success-icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 19px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      background: radial-gradient(circle at 30% 20%, #126fc0, #061c48 70%);
      box-shadow: 0 0 0 7px rgba(32, 231, 255, .08),
                  0 0 32px rgba(32, 231, 255, .34),
                  inset 0 0 20px rgba(32, 231, 255, .16);
      animation: float 3s ease-in-out infinite;
    }

    .success-icon svg { width: 49px; height: 49px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.2;
      font-weight: 850;
      letter-spacing: -.7px;
    }

    h1 span {
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(32, 231, 255, .22);
    }

    .welcome {
      margin: 12px 0 25px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .brand {
      color: var(--cyan);
      font-weight: 850;
      letter-spacing: .3px;
    }

    .divider {
      width: 72%;
      height: 1px;
      margin: 0 auto 24px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }

    .remaining-box {
      padding: 19px 15px 20px;
      margin-bottom: 19px;
      border: 1px solid rgba(53, 242, 160, .8);
      border-radius: 19px;
      background: linear-gradient(130deg, rgba(0, 204, 170, .20), rgba(0, 96, 255, .17));
      box-shadow: inset 0 0 25px rgba(0, 255, 195, .055),
                  0 0 22px rgba(53, 242, 160, .08);
    }

    .remaining-label {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
      color: #e4f4ff;
      font-size: 13px;
      font-weight: 650;
    }

    .battery {
      width: 18px;
      height: 12px;
      display: inline-block;
      position: relative;
      border: 1.5px solid var(--green);
      border-radius: 3px;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 4px;
      background: var(--green);
      border-radius: 0 2px 2px 0;
    }

    .battery::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 1px;
      background: var(--green);
    }

    .remaining-value {
      color: var(--green);
      font-size: clamp(30px, 8vw, 37px);
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: -.8px;
      overflow-wrap: anywhere;
      text-shadow: 0 0 22px rgba(53, 242, 160, .2);
    }

    .redirect-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 18px;
      padding: 13px 12px;
      border: 1px solid rgba(120, 165, 255, .32);
      border-radius: 15px;
      background: rgba(55, 103, 190, .22);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .redirect-icon {
      flex: 0 0 auto;
      color: var(--cyan);
      font-size: 23px;
    }

    .redirect-box strong { color: var(--cyan); }

    .btn {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 14px 17px;
      border: 1px solid rgba(160, 248, 255, .65);
      border-radius: 15px;
      background: linear-gradient(105deg, #04c9f4 0%, #0862ff 55%, #16d9ae 130%);
      color: #fff;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .65px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 9px 28px rgba(0, 113, 255, .30),
                  inset 0 1px 0 rgba(255, 255, 255, .25);
      transition: transform .2s ease, filter .2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn svg { width: 19px; height: 19px; }

    .footer {
      margin-top: 20px;
      color: #7897c5;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 420px) {
      body { padding: 13px; }
      .card { padding: 26px 18px 21px; border-radius: 23px; }
      .success-icon { width: 76px; height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="content">
      <div class="success-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M12 25C23 14 41 14 52 25" stroke="#20e7ff" stroke-width="5" stroke-linecap="round"/>
          <path d="M20 33C27 26 37 26 44 33" stroke="#20e7ff" stroke-width="5" stroke-linecap="round"/>
          <path d="M28 41C30.5 38.5 33.5 38.5 36 41" stroke="#20e7ff" stroke-width="5" stroke-linecap="round"/>
          <circle cx="32" cy="49" r="3" fill="#20e7ff"/>
        </svg>
      </div>

      <p class="eyebrow">Accès autorisé</p>
      <h1>Connexion <span>Réussie !</span></h1>
      <p class="welcome">
        Bienvenue sur <span class="brand">ZoNe 206</span><br>
        Votre connexion Wi-Fi est active.
      </p>

      <div class="divider"></div>

      <section class="remaining-box" aria-label="Données restantes">
        <div class="remaining-label">
          <span class="battery" aria-hidden="true"></span>
          Données restantes
        </div>
        <div class="remaining-value" id="remaining" aria-live="polite">—</div>
      </section>

      <div class="redirect-box">
        <span class="redirect-icon" aria-hidden="true">◷</span>
        <span>Redirection automatique vers le statut<br>dans <strong>7 secondes</strong>…</span>
      </div>

      <a href="$(link-status)" class="btn">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 19V13M10 19V8M16 19V4M22 19V10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Voir mon statut
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12H19M12 5L19 12L12 19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <div class="footer">ZoNe 206 · FAST WI-FI</div>
    </div>
  </main>

  <script>
    (function () {
      function toGiB(val) {
        if (!val || val === "" || val.indexOf("$") !== -1 || val === "---" || val === "0") return null;
        var b = parseInt(val, 10);
        if (isNaN(b) || b <= 0) return null;
        return (b / (1024 * 1024 * 1024)).toFixed(2) + " GiB";
      }

      // Priorité 1 : valeur déjà formatée par MikroTik
      var nice = "$(remain-bytes-total-nice)";
      if (nice && nice.indexOf("$") === -1 && nice !== "" && nice !== "---") {
        document.getElementById("remaining").textContent = nice;
      } else {
        // Priorité 2 : conversion manuelle si la variable formatée est indisponible
        var remaining = toGiB("$(remain-bytes-total)")
                    || toGiB("$(remain-bytes-out)")
                    || toGiB("$(remain-bytes-in)")
                    || toGiB("$(bytes-left)");
        document.getElementById("remaining").textContent = remaining || "—";
      }
    })();
  </script>
</body>
</html>
